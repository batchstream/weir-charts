{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "weir.fullname" . }}
  labels:
    {{- include "weir.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames: [{{ .Release.Namespace | quote }}]
  selector:
    matchLabels:
      {{- include "weir.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
      relabelings:
        - targetLabel: namespace
          replacement: {{ .Release.Namespace | quote }}
        - targetLabel: weir_group
          replacement: {{ include "weir.group" . | quote }}
        - targetLabel: weir_mesh
          replacement: {{ ternary .Values.mesh.name "" .Values.mesh.enabled | quote }}
{{- end }}
