{{- include "weir.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "weir.fullname" . }}
  labels:
    {{- include "weir.labels" . | nindent 4 }}
data:
  node.yaml: |
    {{- include "weir.node" . | nindent 4 }}
  {{- if not .Values.storesSecret }}
  routes.yaml: |
    stores:
      {{- .Values.stores | toYaml | nindent 6 }}
  {{- end }}
