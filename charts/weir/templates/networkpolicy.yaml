{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "weir.fullname" . }}
  labels:
    {{- include "weir.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "weir.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- toYaml .Values.networkPolicy.ingress | nindent 4 }}
    {{- if .Values.metrics.enabled }}
    {{- with .Values.metrics.ingress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.dns.podSelector | nindent 12 }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
