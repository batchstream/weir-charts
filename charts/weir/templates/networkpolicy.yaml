{{- if .Values.networkPolicy.enabled }}
{{- $ingress := .Values.networkPolicy.ingress }}
{{- $egress := .Values.networkPolicy.egress }}
{{- if .Values.metrics.enabled }}
{{- $ingress = concat $ingress .Values.metrics.ingress }}
{{- end }}
{{- if .Values.mesh.enabled }}
{{- $selector := dict "podSelector" (dict "matchLabels" (dict "weir.batchstream.io/mesh" .Values.mesh.name)) }}
{{- $ports := list (dict "protocol" "TCP" "port" "peer") }}
{{- $ingress = append $ingress (dict "from" (list $selector) "ports" $ports) }}
{{- $egress = append $egress (dict "to" (list $selector) "ports" $ports) }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "weir.fullname" . }}
  labels:
    {{- include "weir.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "weir.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- toYaml $ingress | nindent 4 }}
  egress:
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.dns.podSelector | nindent 12 }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- with $egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
