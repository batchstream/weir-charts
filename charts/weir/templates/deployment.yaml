{{- include "weir.validate" . -}}
{{- $startup := int .Values.lifecycle.startupTimeoutSeconds -}}
{{- $probeMilliseconds := int .Values.probeTimeoutMilliseconds -}}
{{- $probeTimeout := printf "%dms" $probeMilliseconds -}}
{{- $probeSeconds := add (div (add $probeMilliseconds 999) 1000) 1 -}}
{{- $nativeProbePeriod := 10 -}}
{{- $startupFailures := add (div (add $startup (sub $nativeProbePeriod 1)) $nativeProbePeriod) 1 -}}
{{- $startupBudget := mul $startupFailures (max $nativeProbePeriod $probeSeconds) -}}
{{- $minimumProgress := add (int .Values.minReadySeconds) $startupBudget -}}
{{- $progress := int .Values.progressDeadlineSeconds -}}
{{- if le $progress $minimumProgress -}}
{{- fail (printf "progressDeadlineSeconds must exceed minReadySeconds plus the derived startup probe budget (%d seconds)" $minimumProgress) -}}
{{- end -}}
{{- $shutdown := int .Values.lifecycle.shutdownTimeoutSeconds -}}
{{- $cleanup := int .Values.lifecycle.cleanupTimeoutSeconds -}}
{{- $minimumGrace := add (int .Values.preStopDelaySeconds) $shutdown (mul $cleanup 2) 1 -}}
{{- $grace := int (default $minimumGrace .Values.terminationGracePeriodSeconds) -}}
{{- if lt $grace $minimumGrace -}}
{{- fail (printf "terminationGracePeriodSeconds must be 0 (automatic) or at least %d: preStopDelaySeconds + shutdownTimeoutSeconds + two cleanupTimeoutSeconds phases + one second for final exit" $minimumGrace) -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weir.fullname" . }}
  labels:
    {{- include "weir.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  minReadySeconds: {{ .Values.minReadySeconds }}
  progressDeadlineSeconds: {{ $progress }}
  strategy:
    type: {{ .Values.strategy.type }}
    {{- if eq .Values.strategy.type "RollingUpdate" }}
    rollingUpdate:
      {{- toYaml .Values.strategy.rollingUpdate | nindent 6 }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "weir.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "weir.selectorLabels" . | nindent 8 }}
        {{- if .Values.mesh.enabled }}
        {{- include "weir.meshLabels" . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        weir.batchstream.io/stores-revision: {{ .Values.storesRevision | quote }}
        weir.batchstream.io/source-revision: {{ index .Chart.Annotations "weir.batchstream.io/source-revision" | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ $grace }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: weir
          image: {{ include "weir.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "--config", "/etc/weir/node.yaml", "--routes", "/etc/weir/routes.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: grpc
              containerPort: {{ .Values.service.port }}
            {{- if .Values.mesh.enabled }}
            - name: peer
              containerPort: {{ .Values.mesh.port }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.diagnosticsPort }}
            {{- end }}
          {{- if .Values.mesh.enabled }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: WEIR_PEER_ADDRESS
              value: "[$(POD_IP)]:{{ .Values.mesh.port }}"
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if gt (int .Values.preStopDelaySeconds) 0 }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.preStopDelaySeconds }}
          {{- end }}
          startupProbe:
            exec:
              command: ["/weir", "probe", "ready", "--timeout", {{ $probeTimeout | quote }}, "--address", "127.0.0.1:{{ .Values.diagnosticsPort }}"]
            timeoutSeconds: {{ $probeSeconds }}
            failureThreshold: {{ $startupFailures }}
          readinessProbe:
            exec:
              command: ["/weir", "probe", "ready", "--timeout", {{ $probeTimeout | quote }}, "--address", "127.0.0.1:{{ .Values.diagnosticsPort }}"]
            timeoutSeconds: {{ $probeSeconds }}
          livenessProbe:
            exec:
              command: ["/weir", "probe", "live", "--timeout", {{ $probeTimeout | quote }}, "--address", "127.0.0.1:{{ .Values.diagnosticsPort }}"]
            timeoutSeconds: {{ $probeSeconds }}
          volumeMounts:
            - name: config
              mountPath: /etc/weir
              readOnly: true
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          projected:
            defaultMode: 0440
            sources:
              - configMap:
                  name: {{ include "weir.fullname" . }}
                  items:
                    - key: node.yaml
                      path: node.yaml
                    {{- if not .Values.storesSecret }}
                    - key: routes.yaml
                      path: routes.yaml
                    {{- end }}
              {{- if .Values.storesSecret }}
              - secret:
                  name: {{ .Values.storesSecret }}
                  items:
                    - key: routes.yaml
                      path: routes.yaml
              {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
