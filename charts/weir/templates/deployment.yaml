{{- include "weir.validate" . -}}
{{- /* Weir bounds startup at 30s. The first probe can land anywhere in the first
native 10s period, so allow two periods beyond that bound. */ -}}
{{- $nativeProbePeriod := 10 -}}
{{- $startupFailures := 5 -}}
{{- $startupBudget := mul $startupFailures $nativeProbePeriod -}}
{{- $minimumProgress := add (int .Values.minReadySeconds) $startupBudget -}}
{{- $progress := int .Values.progressDeadlineSeconds -}}
{{- if le $progress $minimumProgress -}}
{{- fail (printf "progressDeadlineSeconds must exceed minReadySeconds plus the derived startup probe budget (%d seconds)" $minimumProgress) -}}
{{- end -}}
{{- /* Weir gives each Store a fixed 2s cleanup after the shutdown drain. */ -}}
{{- $minimumGrace := add (int .Values.preStopDelaySeconds) (int .Values.shutdownTimeoutSeconds) 2 1 -}}
{{- $grace := int (default $minimumGrace .Values.terminationGracePeriodSeconds) -}}
{{- if lt $grace $minimumGrace -}}
{{- fail (printf "terminationGracePeriodSeconds must be 0 (automatic) or at least %d: preStopDelaySeconds + shutdownTimeoutSeconds + 2s Store cleanup + one second for final exit" $minimumGrace) -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weir.fullname" . }}
  labels:
    {{- include "weir.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- else }}
  {{- /* KEDA owns the count. Writing back the live count keeps an upgrade from
  dropping the field, which would reset a running Deployment to one replica. */}}
  {{- with lookup "apps/v1" "Deployment" .Release.Namespace (include "weir.fullname" .) }}
  replicas: {{ .spec.replicas }}
  {{- end }}
  {{- end }}
  minReadySeconds: {{ .Values.minReadySeconds }}
  progressDeadlineSeconds: {{ $progress }}
  strategy:
    type: {{ .Values.strategy.type }}
    {{- if eq .Values.strategy.type "RollingUpdate" }}
    rollingUpdate:
      {{- toYaml .Values.strategy.rollingUpdate | nindent 6 }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "weir.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "weir.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        weir.batchstream.io/source-revision: {{ index .Chart.Annotations "weir.batchstream.io/source-revision" | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ $grace }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: weir
          image: {{ include "weir.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "--config", "/etc/weir/weir.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: grpc
              containerPort: {{ .Values.service.port }}
            - name: metrics
              containerPort: {{ .Values.diagnosticsPort }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if gt (int .Values.preStopDelaySeconds) 0 }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.preStopDelaySeconds }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /readyz
              port: metrics
            failureThreshold: {{ $startupFailures }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
          volumeMounts:
            - name: config
              mountPath: /etc/weir
              readOnly: true
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "weir.fullname" . }}
            defaultMode: 0440
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
