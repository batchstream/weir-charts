{{- if .Values.mesh.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "weir.meshName" . }}
  labels:
    {{- include "weir.labels" . | nindent 4 }}
    app.kubernetes.io/component: mesh
spec:
  type: ClusterIP
  selector:
    {{- include "weir.meshLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.service.port }}
      targetPort: grpc
      protocol: TCP
      appProtocol: kubernetes.io/h2c
    - name: peer
      port: {{ .Values.mesh.port }}
      targetPort: peer
      protocol: TCP
      appProtocol: kubernetes.io/h2c
{{- end }}
