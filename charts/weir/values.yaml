replicaCount: 1
minReadySeconds: 15
# Deployment rollout budget, including scheduling and image pull; positive int32 seconds.
progressDeadlineSeconds: 180
nameOverride: ""
fullnameOverride: ""
image:
  repository: ghcr.io/batchstream/weir
  digest: sha256:ff5cc59ac80a9251258d4a9bd738093e57345af16b6a20238acecd79896f9a1e
  pullPolicy: IfNotPresent
imagePullSecrets: []
# Weir Store definitions; backends and credentials are provisioned separately.
stores: []
# Drain of admitted work after SIGTERM, in whole seconds.
shutdownTimeoutSeconds: 5
service:
  port: 7447
# Serves /livez, /readyz for kubelet probes and /metrics.
diagnosticsPort: 7449
metrics:
  enabled: false
  annotations: {}
  ingress: []
  serviceMonitor:
    enabled: false
    labels: {}
    interval: 15s
    scrapeTimeout: 10s
  # Alerts for this group. Requires Prometheus Operator; labels must match its ruleSelector.
  prometheusRule:
    enabled: false
    labels: {}
  # A dashboard for this group in a ConfigMap; labels must match the Grafana dashboard sidecar.
  grafanaDashboard:
    enabled: false
    labels: {}
autoscaling:
  enabled: false
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 30
  cooldownPeriod: 300
  # Native KEDA triggers. Controllers, CRDs and authentication refs are external.
  triggers: []
  scaleDown:
    stabilizationWindowSeconds: 300
    policies:
      - type: Pods
        value: 1
        periodSeconds: 60
resources:
  requests:
    cpu: "2"
    memory: 3Gi
  limits:
    cpu: "2"
    memory: 3Gi
preStopDelaySeconds: 15
# 0 derives preStopDelaySeconds + shutdownTimeoutSeconds + Weir's fixed 2s Store
# cleanup + one second for final exit.
# A positive override can reserve more exit overhead and must cover this budget.
terminationGracePeriodSeconds: 0
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
podDisruptionBudget:
  enabled: false
  maxUnavailable: 1
networkPolicy:
  enabled: true
  ingress:
    - from:
        - podSelector:
            matchLabels:
              weir-client: "true"
      ports:
        - protocol: TCP
          port: grpc
  # Add precise backend destinations here.
  egress: []
  dns:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        k8s-app: kube-dns
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
extraVolumes: []
extraVolumeMounts: []
