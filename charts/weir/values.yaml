# One release is one Store owner group. Replicas share the same configuration.
replicaCount: 1
minReadySeconds: 15
nameOverride: ""
fullnameOverride: ""
clusterDomain: cluster.local
image:
  repository: ghcr.io/batchstream/weir
  digest: sha256:2779ffd51f6aa21ae92e40d4de82e8f7311cdb947b40e47dd25cf6838a3a33ed
  pullPolicy: IfNotPresent
imagePullSecrets: []
# This group owns the listed Stores. Backends and credentials are provisioned separately.
stores: []
# An external Secret may supply routes.yaml instead of a non-empty stores list.
storesSecret: ""
storesRevision: ""
# Process settings only; listeners, discovery and metrics access are Chart-managed.
nodeConfig: {}
service:
  port: 7447
  annotations: {}
mesh:
  enabled: true
  name: weir
  port: 7448
  # Additional peer endpoints; cross-namespace access needs explicit network rules.
  seeds: []
diagnostics:
  port: 7449
metrics:
  enabled: false
  annotations: {}
  ingress: []
  serviceMonitor:
    enabled: false
    labels: {}
    interval: 15s
    scrapeTimeout: 10s
autoscaling:
  enabled: false
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 30
  cooldownPeriod: 300
  # Native KEDA triggers. Controllers, CRDs and authentication refs are external.
  triggers: []
  scaleDown:
    stabilizationWindowSeconds: 300
    policies:
      - type: Pods
        value: 1
        periodSeconds: 60
resources:
  requests:
    cpu: "2"
    memory: 3Gi
  limits:
    cpu: "2"
    memory: 3Gi
preStopDelaySeconds: 15
terminationGracePeriodSeconds: 45
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
podDisruptionBudget:
  enabled: false
  maxUnavailable: 1
networkPolicy:
  enabled: true
  ingress:
    - from:
        - podSelector:
            matchLabels:
              weir-client: "true"
      ports:
        - protocol: TCP
          port: 7447
  # Add precise backend destinations and any extra peer endpoints here.
  egress: []
  dns:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        k8s-app: kube-dns
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
extraVolumes: []
extraVolumeMounts: []
