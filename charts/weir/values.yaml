replicaCount: 1
nameOverride: ""
fullnameOverride: ""
image:
  repository: ghcr.io/batchstream/weir
  # Required: a compatible immutable image; no current-contract release is assumed.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
# Provision this Secret separately; never put backend credentials in Helm values.
config:
  existingSecret: weir-config
  # Secret must contain node.yaml and routes.yaml.
  # Non-secret {node: <basic config>, routes: <Store config>} only.
  # Set existingSecret to "" when using data.
  data: null
  # Change this when updating an existing Secret to trigger a controlled restart.
  revision: ""
service:
  port: 7447
  annotations: {}
peer:
  enabled: false
  port: 7448
diagnostics:
  port: 7449
# Requires diagnostics.address: 0.0.0.0:7449 and diagnostics.allow_intranet: true.
metrics:
  enabled: false
  annotations: {}
  ingress: []
resources:
  requests:
    cpu: "2"
    memory: 3Gi
  limits:
    cpu: "2"
    memory: 3Gi
terminationGracePeriodSeconds: 15
# No surge: still budget terminating Pods alongside replacements.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
podDisruptionBudget:
  enabled: false
  maxUnavailable: 1
networkPolicy:
  enabled: true
  # Only labeled clients in the release namespace can reach application gRPC.
  ingress:
    - from:
        - podSelector:
            matchLabels:
              weir-client: "true"
      ports:
        - protocol: TCP
          port: 7447
  # Add precise backend/peer destinations here. DNS is allowed separately.
  egress: []
  dns:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        k8s-app: kube-dns
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
# Read-only CA/config mounts only; Weir does not need persistent application storage.
extraVolumes: []
extraVolumeMounts: []
