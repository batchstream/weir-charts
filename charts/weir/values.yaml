replicaCount: 1
nameOverride: ""
fullnameOverride: ""
image:
  repository: ghcr.io/batchstream/weir
  tag: "278264db2f9617ad583c6b56d19b8aaf5943e771"
  digest: sha256:aee0c24fd5a0edbe81d335522e2741b34ca267f8246c893e15d6ef0097c18bb4
  pullPolicy: IfNotPresent
imagePullSecrets: []
# Provision this Secret separately; never put backend credentials in Helm values.
config:
  existingSecret: weir-config
  key: node.json
  # Non-secret configuration only. Set existingSecret to "" when using data.
  data: null
  # Change this when updating an existing Secret to trigger a controlled restart.
  revision: ""
service:
  port: 7447
  annotations: {}
containerPort: 7447
peer:
  enabled: false
  port: 7448
diagnostics:
  port: 7449
resources:
  requests:
    cpu: "2"
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 1Gi
terminationGracePeriodSeconds: 15
# No surge: still budget terminating Pods alongside replacements.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
podDisruptionBudget:
  enabled: false
  maxUnavailable: 1
networkPolicy:
  enabled: true
  # Only labeled clients in the release namespace can reach application gRPC.
  ingress:
    - from:
        - podSelector:
            matchLabels:
              weir-client: "true"
      ports:
        - protocol: TCP
          port: 7447
  # Add precise backend/peer destinations here. DNS is allowed separately.
  egress: []
  dns:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        k8s-app: kube-dns
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
# Read-only CA/config mounts only; Weir does not need persistent application storage.
extraVolumes: []
extraVolumeMounts: []
