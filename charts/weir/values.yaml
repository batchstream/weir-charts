replicaCount: 1
minReadySeconds: 15
# Deployment rollout budget, including scheduling and image pull; positive int32 seconds.
progressDeadlineSeconds: 180
nameOverride: ""
fullnameOverride: ""
clusterDomain: cluster.local
image:
  repository: ghcr.io/batchstream/weir
  digest: sha256:3144fcb210fb7ab323bebf358473adce78baf1cee88ac46c30df8b36f533440d
  pullPolicy: IfNotPresent
imagePullSecrets: []
# Backends and credentials are provisioned separately.
stores: []
# Routes-only external Secret; mutually exclusive with stores.
storesSecret: ""
storesRevision: ""
# Process policy; lifecycle and addresses are generated by the Chart.
nodeConfig: {}
# Whole seconds; drives generated Weir timers and Pod budgets.
lifecycle:
  startupTimeoutSeconds: 5
  shutdownTimeoutSeconds: 5
  cleanupTimeoutSeconds: 2
service:
  port: 7447
  annotations: {}
diagnosticsPort: 7449
# The CLI deadline; kubelet's whole-second timeout is rounded up plus one second.
probeTimeoutMilliseconds: 750
metrics:
  enabled: false
  annotations: {}
  ingress: []
  serviceMonitor:
    enabled: false
    labels: {}
    interval: 15s
    scrapeTimeout: 10s
autoscaling:
  enabled: false
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 30
  cooldownPeriod: 300
  # Native KEDA triggers. Controllers, CRDs and authentication refs are external.
  triggers: []
  scaleDown:
    stabilizationWindowSeconds: 300
    policies:
      - type: Pods
        value: 1
        periodSeconds: 60
resources:
  requests:
    cpu: "2"
    memory: 3Gi
  limits:
    cpu: "2"
    memory: 3Gi
preStopDelaySeconds: 15
# 0 derives preStopDelaySeconds + shutdownTimeoutSeconds + 2*cleanupTimeoutSeconds + one second.
# Cleanup has two sequential bounded phases; the extra second permits final exit.
# A positive override can reserve more exit overhead and must cover this budget.
terminationGracePeriodSeconds: 0
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
podDisruptionBudget:
  enabled: false
  maxUnavailable: 1
networkPolicy:
  enabled: true
  ingress:
    - from:
        - podSelector:
            matchLabels:
              weir-client: "true"
      ports:
        - protocol: TCP
          port: grpc
  # Add precise backend destinations here.
  egress: []
  dns:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        k8s-app: kube-dns
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
extraVolumes: []
extraVolumeMounts: []
