# Overlay examples/mongo.yaml; release mongo, namespace application.
# Install Prometheus Operator and KEDA separately, then supply their existing endpoints.
metrics:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - {protocol: TCP, port: metrics}
  serviceMonitor:
    enabled: true
    labels:
      release: monitoring
    interval: 15s
    scrapeTimeout: 10s
autoscaling:
  enabled: true
  minReplicaCount: 2
  maxReplicaCount: 10
  pollingInterval: 30
  cooldownPeriod: 300
  triggers:
    - type: prometheus
      metricType: AverageValue
      metadata:
        serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
        # The group's CPU in cores, only while every discovered scrape target is
        # healthy. HPA AverageValue divides it across replicas. Verify target
        # coverage separately.
        query: >-
          sum(rate(process_cpu_seconds_total{namespace="application",weir_group="application/mongo"}[1m]))
          and on() (min(up{namespace="application",weir_group="application/mongo"}) == 1)
        # 70% of the default 2-CPU limit per replica.
        threshold: "1.4"
        ignoreNullValues: "false"
        # Bound the HTTP request; a failed or empty query must remain an error.
        timeout: "10000"
      # Reference an existing TriggerAuthentication if Prometheus requires authentication.
      # authenticationRef:
      #   name: prometheus-auth
podDisruptionBudget:
  enabled: true
