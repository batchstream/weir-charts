# Install this Store group as its own release in namespace application.
mesh:
  name: application
stores:
- name: search
  backend:
    search:
      url: http://search:9200
  batching:
    max_operations: 32
    max_bytes: 8MiB
  queue:
    max_operations: 1024
    max_bytes: 32MiB
networkPolicy:
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: search
    ports:
    - protocol: TCP
      port: 9200
