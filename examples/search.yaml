# Release name search, namespace application. Update advertised DNS for your release.
# Non-secret example; provision the backend and target collections independently.
peer:
  enabled: true
config:
  existingSecret: ""
  data:
    node:
      listeners:
        application: 0.0.0.0:7447
        peer: 0.0.0.0:7448
      diagnostics:
        address: 127.0.0.1:7449
      discovery:
        group: application-search
        peer_address_env: WEIR_PEER_ADDRESS
        seeds: [weir-seed.application.svc:7448]
        advertise: [search-weir-headless.application.svc:7447]
    routes:
      stores:
        - name: search
          backend:
            search:
              url: http://search:9200
          # Aggregation is independent of active execution concurrency.
          batching:
            max_operations: 32
            max_bytes: 8MiB
            # These capacities count waiting work; dispatch releases count and bytes.
            queue:
              max_operations: 1024
              max_bytes: 32MiB
networkPolicy:
  ingress:
    - from:
        - podSelector:
            matchLabels:
              weir-client: "true"
      ports:
        - {protocol: TCP, port: 7447}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: weir
      ports:
        - {protocol: TCP, port: 7448}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: search
      ports:
        - {protocol: TCP, port: 9200}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: weir
      ports:
        - {protocol: TCP, port: 7448}
