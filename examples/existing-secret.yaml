config:
  existingSecret: weir-config-v1
  revision: v1
# Add a standard Secret/ConfigMap for explicit backend CA roots if needed.
# The referenced objects are provisioned outside Helm.
extraVolumes:
  - name: backend-ca
    configMap:
      name: backend-ca
extraVolumeMounts:
  - name: backend-ca
    mountPath: /etc/backend-ca
    readOnly: true
networkPolicy:
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.0.10/32
      ports:
        - {protocol: TCP, port: 27017}
