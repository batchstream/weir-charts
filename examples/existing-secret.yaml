config:
  # This externally provisioned Secret contains node.yaml and routes.yaml.
  # routes.yaml uses mongodb username_file/password_file or search.connection equivalents.
  existingSecret: weir-config-v2
  revision: v2
extraVolumes:
  - name: backend-auth
    secret:
      secretName: weir-backend-auth
      defaultMode: 0440
  - name: backend-ca
    configMap:
      name: backend-ca
extraVolumeMounts:
  - name: backend-auth
    mountPath: /etc/backend-auth
    readOnly: true
  - name: backend-ca
    mountPath: /etc/backend-ca
    readOnly: true
networkPolicy:
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.0.10/32
      ports:
        - {protocol: TCP, port: 27017}
