# Secret contains only routes.yaml; node.yaml is generated by the Chart.
# routes.yaml uses backend.authentication.username_file/password_file.
storesSecret: weir-stores-v2
storesRevision: v2
extraVolumes:
- name: backend-auth
  secret:
    secretName: weir-backend-auth
    defaultMode: 288
- name: backend-ca
  configMap:
    name: backend-ca
extraVolumeMounts:
- name: backend-auth
  mountPath: /etc/backend-auth
  readOnly: true
- name: backend-ca
  mountPath: /etc/backend-ca
  readOnly: true
networkPolicy:
  egress:
  - to:
    - ipBlock:
        cidr: 10.0.0.10/32
    ports:
    - protocol: TCP
      port: 27017
