# Install this Store group as its own release in namespace application.
mesh:
  name: application
stores:
- name: mongo
  backend:
    mongodb:
      uri: mongodb://mongo:27017/?directConnection=true
networkPolicy:
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: mongo
    ports:
    - protocol: TCP
      port: 27017
