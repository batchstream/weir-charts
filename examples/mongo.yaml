# Non-secret intranet example; configure a pre-created replica-set collection.
config:
  existingSecret: ""
  data:
    application: 0.0.0.0:7447
    diagnostics: 127.0.0.1:7449
    memory_mib: 768
    services:
      - name: database
        local:
          concurrency: 2
          mongo:
            uri: mongodb://mongo:27017/?directConnection=true
            database: application
            collection: records
    routes:
      - store: records
        service: database
networkPolicy:
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: mongo
      ports:
        - {protocol: TCP, port: 27017}
