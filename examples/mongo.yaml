# Release name weir, namespace application. Update advertised DNS for your release.
# Non-secret example; provision the backend and target collections independently.
peer:
  enabled: true
config:
  existingSecret: ""
  data:
    node:
      listeners:
        application: 0.0.0.0:7447
        peer: 0.0.0.0:7448
      diagnostics:
        address: 127.0.0.1:7449
      discovery:
        group: application-mongo
        peer_address_env: WEIR_PEER_ADDRESS
        seeds: [weir-seed.application.svc:7448]
        advertise: [weir-weir-headless.application.svc:7447]
    routes:
      stores:
        - name: mongo
          mongodb:
            uri: mongodb://mongo:27017/?directConnection=true
          # Batch size controls each physical exchange, independently of execution concurrency.
          max_batch_operations: 32
          max_batch_bytes: 8MiB
          # These capacities count waiting work; dispatch releases count and bytes.
          batch_queue:
            max_operations: 1024
            max_bytes: 32MiB
networkPolicy:
  ingress:
    - from:
        - podSelector:
            matchLabels:
              weir-client: "true"
      ports:
        - {protocol: TCP, port: 7447}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: weir
      ports:
        - {protocol: TCP, port: 7448}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: mongo
      ports:
        - {protocol: TCP, port: 27017}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: weir
      ports:
        - {protocol: TCP, port: 7448}
