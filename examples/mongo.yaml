# Install this Store group as its own release in namespace application.
mesh:
  name: application
stores:
- name: mongo
  backend:
    mongodb:
      uri: mongodb://mongo:27017/?directConnection=true
  batching:
    max_operations: 32
    max_bytes: 8MiB
  queue:
    max_operations: 1024
    max_bytes: 32MiB
networkPolicy:
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: mongo
    ports:
    - protocol: TCP
      port: 27017
