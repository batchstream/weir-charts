# Overlay examples/mongo.yaml. Credentials and the CA come from an externally
# managed Secret mounted read-only and referenced by absolute path.
stores:
- name: mongo
  mongodb:
    uri: mongodb://mongo:27017/?directConnection=true&authMechanism=SCRAM-SHA-256&authSource=admin&tls=true
  authentication:
    username_file: /etc/backend-auth/username
    password_file: /etc/backend-auth/password
  tls:
    ca_file: /etc/backend-auth/ca.pem
extraVolumes:
- name: backend-auth
  secret:
    secretName: weir-backend-auth
    defaultMode: 0440
extraVolumeMounts:
- name: backend-auth
  mountPath: /etc/backend-auth
  readOnly: true
