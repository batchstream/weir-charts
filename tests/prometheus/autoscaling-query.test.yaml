# Real PromQL semantics for the query in examples/prometheus-autoscaling.yaml.
# Failed samples, stale samples and absent up must not become valid lower load.
rule_files: []
evaluation_interval: 1m
tests:
- interval: 1m
  input_series:
  - series: weir_store_pending_entries{namespace="application",weir_group="application/mongo",pod="a",store="primary"}
    values: 32 32 32 32
  - series: weir_store_active_executions{namespace="application",weir_group="application/mongo",pod="a",store="primary"}
    values: 0 0 0 0
  - series: up{namespace="application",weir_group="application/mongo",pod="a"}
    values: 1 1 1 1
  - series: weir_store_pending_entries{namespace="application",weir_group="application/mongo",pod="b",store="primary"}
    values: 32 32 32 32
  - series: weir_store_active_executions{namespace="application",weir_group="application/mongo",pod="b",store="primary"}
    values: 0 0 0 0
  - series: up{namespace="application",weir_group="application/mongo",pod="b"}
    values: 1 1 1 1
  - series: weir_store_pending_entries{namespace="application",weir_group="application/mongo",pod="c",store="primary"}
    values: 32 32 32 32
  - series: weir_store_active_executions{namespace="application",weir_group="application/mongo",pod="c",store="primary"}
    values: 0 0 0 0
  - series: up{namespace="application",weir_group="application/mongo",pod="c"}
    values: 1 1 1 1
  - series: weir_store_pending_entries{namespace="application",weir_group="application/mongo",pod="d",store="primary"}
    values: 32 32 stale 32
  - series: weir_store_active_executions{namespace="application",weir_group="application/mongo",pod="d",store="primary"}
    values: 0 0 stale 0
  - series: up{namespace="application",weir_group="application/mongo",pod="d"}
    values: 1 0 0 1
  - series: weir_store_pending_entries{namespace="application",weir_group="application/search",pod="other",store="primary"}
    values: 1000 1000 1000 1000
  - series: up{namespace="application",weir_group="application/search",pod="other"}
    values: 0 0 0 0
  promql_expr_test:
  - expr: (sum(weir_store_pending_entries{namespace="application",weir_group="application/mongo"})
      + sum(weir_store_active_executions{namespace="application",weir_group="application/mongo"}))
      and on() (min(up{namespace="application",weir_group="application/mongo"}) ==
      1)
    eval_time: 0m
    exp_samples:
    - labels: '{}'
      value: 128
  - expr: (sum(weir_store_pending_entries{namespace="application",weir_group="application/mongo"})
      + sum(weir_store_active_executions{namespace="application",weir_group="application/mongo"}))
      and on() (min(up{namespace="application",weir_group="application/mongo"}) ==
      1)
    eval_time: 1m
    exp_samples: []
  - expr: (sum(weir_store_pending_entries{namespace="application",weir_group="application/mongo"})
      + sum(weir_store_active_executions{namespace="application",weir_group="application/mongo"}))
      and on() (min(up{namespace="application",weir_group="application/mongo"}) ==
      1)
    eval_time: 2m
    exp_samples: []
  - expr: (sum(weir_store_pending_entries{namespace="application",weir_group="application/mongo"})
      + sum(weir_store_active_executions{namespace="application",weir_group="application/mongo"}))
      and on() (min(up{namespace="application",weir_group="application/mongo"}) ==
      1)
    eval_time: 3m
    exp_samples:
    - labels: '{}'
      value: 128
- interval: 1m
  input_series:
  - series: weir_store_pending_entries{namespace="application",weir_group="application/mongo",pod="a",store="primary"}
    values: '32'
  - series: weir_store_active_executions{namespace="application",weir_group="application/mongo",pod="a",store="primary"}
    values: '0'
  promql_expr_test:
  - expr: (sum(weir_store_pending_entries{namespace="application",weir_group="application/mongo"})
      + sum(weir_store_active_executions{namespace="application",weir_group="application/mongo"}))
      and on() (min(up{namespace="application",weir_group="application/mongo"}) ==
      1)
    eval_time: 0m
    exp_samples: []
- interval: 1m
  input_series: []
  promql_expr_test:
  - expr: (sum(weir_store_pending_entries{namespace="application",weir_group="application/mongo"})
      + sum(weir_store_active_executions{namespace="application",weir_group="application/mongo"}))
      and on() (min(up{namespace="application",weir_group="application/mongo"}) ==
      1)
    eval_time: 0m
    exp_samples: []
