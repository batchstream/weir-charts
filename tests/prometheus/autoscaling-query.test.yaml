# Real PromQL semantics for the query in examples/prometheus-autoscaling.yaml.
# Failed samples, stale samples and absent up must not become valid lower load.
rule_files: []
evaluation_interval: 30s
tests:
# Four replicas each use one core. While replica d fails its scrape and its
# samples go stale, the query is empty rather than three cores.
- interval: 30s
  input_series:
  - series: 'process_cpu_seconds_total{namespace="application",weir_group="application/mongo",pod="a"}'
    values: 0+30x16
  - series: 'up{namespace="application",weir_group="application/mongo",pod="a"}'
    values: 1x16
  - series: 'process_cpu_seconds_total{namespace="application",weir_group="application/mongo",pod="b"}'
    values: 0+30x16
  - series: 'up{namespace="application",weir_group="application/mongo",pod="b"}'
    values: 1x16
  - series: 'process_cpu_seconds_total{namespace="application",weir_group="application/mongo",pod="c"}'
    values: 0+30x16
  - series: 'up{namespace="application",weir_group="application/mongo",pod="c"}'
    values: 1x16
  - series: 'process_cpu_seconds_total{namespace="application",weir_group="application/mongo",pod="d"}'
    values: 0+30x4 stale _x2 240+30x8
  - series: 'up{namespace="application",weir_group="application/mongo",pod="d"}'
    values: 1x4 0x2 1x8
  - series: 'process_cpu_seconds_total{namespace="application",weir_group="application/search",pod="other"}'
    values: 0+1200x16
  - series: 'up{namespace="application",weir_group="application/search",pod="other"}'
    values: 0x16
  promql_expr_test:
  - expr: "sum(rate(process_cpu_seconds_total{namespace=\"application\",weir_group=\"application/mongo\"}[1m])) and on() (min(up{namespace=\"application\",weir_group=\"application/mongo\"}) == 1)"
    eval_time: 1m30s
    exp_samples:
    - labels: '{}'
      value: 4
  - expr: "sum(rate(process_cpu_seconds_total{namespace=\"application\",weir_group=\"application/mongo\"}[1m])) and on() (min(up{namespace=\"application\",weir_group=\"application/mongo\"}) == 1)"
    eval_time: 3m
    exp_samples: []
  - expr: "sum(rate(process_cpu_seconds_total{namespace=\"application\",weir_group=\"application/mongo\"}[1m])) and on() (min(up{namespace=\"application\",weir_group=\"application/mongo\"}) == 1)"
    eval_time: 5m
    exp_samples:
    - labels: '{}'
      value: 4
# CPU samples without any up series are not a valid lower load.
- interval: 30s
  input_series:
  - series: 'process_cpu_seconds_total{namespace="application",weir_group="application/mongo",pod="a"}'
    values: 0+30x8
  promql_expr_test:
  - expr: "sum(rate(process_cpu_seconds_total{namespace=\"application\",weir_group=\"application/mongo\"}[1m])) and on() (min(up{namespace=\"application\",weir_group=\"application/mongo\"}) == 1)"
    eval_time: 1m30s
    exp_samples: []
- interval: 30s
  input_series: []
  promql_expr_test:
  - expr: "sum(rate(process_cpu_seconds_total{namespace=\"application\",weir_group=\"application/mongo\"}[1m])) and on() (min(up{namespace=\"application\",weir_group=\"application/mongo\"}) == 1)"
    eval_time: 0m
    exp_samples: []
