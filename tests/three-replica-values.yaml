replicaCount: 3
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: '1'
    memory: 512Mi
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
topologySpreadConstraints:
- maxSkew: 1
  minDomains: 2
  topologyKey: kubernetes.io/hostname
  nodeTaintsPolicy: Honor
  whenUnsatisfiable: DoNotSchedule
  labelSelector:
    matchLabels:
      app.kubernetes.io/name: weir
      app.kubernetes.io/instance: weir
metrics:
  enabled: true
  ingress:
  - from:
    - podSelector:
        matchLabels:
          weir-client: 'true'
    ports:
    - protocol: TCP
      port: 7449
networkPolicy:
  egress:
  - to:
    - ipBlock:
        cidr: 10.0.0.10/32
    ports:
    - protocol: TCP
      port: 27017
stores:
- name: mongo
  backend:
    mongodb:
      uri: mongodb://10.0.0.10:27017/?directConnection=true
