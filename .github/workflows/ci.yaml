name: Validate chart
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.17.0
      - run: pip install -r requirements-dev.txt
      - name: Install the Weir contract validator
        run: GOBIN="$PWD/.bin" go install github.com/batchstream/weir/cmd/weir@5107986b882da60751403c7e05bbbebdb12b3cdb
      - name: Install promtool
        run: |
          curl -fsSLo "$RUNNER_TEMP/prometheus.tar.gz" https://github.com/prometheus/prometheus/releases/download/v3.15.1/prometheus-3.15.1.linux-amd64.tar.gz
          echo "6a726885328ad9efebbf36e876ce2fb6225468a71fd1e7ce3ba666d5f4d97a84  $RUNNER_TEMP/prometheus.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/prometheus.tar.gz" --strip-components=1 -C .bin prometheus-3.15.1.linux-amd64/promtool
      - run: make test WEIR_BIN="$PWD/.bin/weir"
        env:
          PROMTOOL: ${{ github.workspace }}/.bin/promtool
      - run: helm package charts/weir --destination dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: weir-chart
          path: dist/*.tgz
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.17.0
      - name: Install kind
        run: GOBIN="$PWD/.bin" go install sigs.k8s.io/kind@v0.33.0
      - name: Build the soak client with the current and the previous SDK
        shell: bash
        run: |
          bin=$PWD/.bin
          git clone -q https://github.com/batchstream/weir-tests "$RUNNER_TEMP/weir-tests"
          cd "$RUNNER_TEMP/weir-tests"
          git checkout -q 1347bcdb3351852b7df484e778a757d0d2e80ff3
          CGO_ENABLED=0 go build -o "$bin/weir-soak" ./cmd/weir-soak
          version=$(jq -er .weir_go_previous versions.json)
          protocol=$(go mod download -json "github.com/batchstream/weir-go@$version" | jq -er .GoMod | xargs awk '$1 == "github.com/batchstream/weir-protocol" {print $2}')
          go get "github.com/batchstream/weir-go@$version" "github.com/batchstream/weir-protocol@$protocol"
          CGO_ENABLED=0 go build -o "$bin/weir-soak-previous" ./cmd/weir-soak
          sdk() { go version -m "$bin/$1" | awk '$2 == "github.com/batchstream/weir-go" {print $3}'; }
          echo "soak clients use $(sdk weir-soak) and $(sdk weir-soak-previous)"
          [ "$(sdk weir-soak)" != "$(sdk weir-soak-previous)" ]
          # Held streams of v0.22.0 fail in a rollout; v0.23.0 fixed them.
          if [ "$version" = v0.22.0 ]; then
            echo 'PREVIOUS_PROFILES=single=40,visible=10,lua=15,batch=30,native=5' >> "$GITHUB_ENV"
          fi
      - name: Extract the charts of the previous server and the commit this change replaces
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          digest() { git show "$1:charts/weir/values.yaml" | sed -n 's/^  digest: //p'; }
          current=$(digest HEAD)
          previous=
          for commit in $(git log --first-parent --format=%H); do
            if [ "$(digest "$commit")" != "$current" ]; then
              previous=$commit
              break
            fi
          done
          [ -n "$previous" ] || { echo "no earlier commit on this branch pins another server" >&2; exit 1; }
          echo "previous server $(digest "$previous") in $previous"
          mkdir -p "$RUNNER_TEMP/previous" "$RUNNER_TEMP/base"
          git archive "$previous" | tar -x -C "$RUNNER_TEMP/previous"
          git archive "$BASE" | tar -x -C "$RUNNER_TEMP/base"
          revision() { sed -n 's/^  weir.batchstream.io\/source-revision: "\(.*\)"$/\1/p' "$1/charts/weir/Chart.yaml"; }
          pins=$RUNNER_TEMP/weir-tests/versions.json
          [ "$(jq -er .weir_source "$pins")" = "$(revision .)" ] || { echo "weir-tests pins another current server than this chart" >&2; exit 1; }
          [ "$(jq -er .weir_previous_source "$pins")" = "$(revision "$RUNNER_TEMP/previous")" ] || { echo "weir-tests pins another previous server than the previous chart" >&2; exit 1; }
      - name: Upgrade from the previous server under load from both SDKs
        env:
          KIND: .bin/kind
        run: THROUGH_CHECKOUT="$RUNNER_TEMP/base" scripts/kind-upgrade.sh "$RUNNER_TEMP/previous" . .bin/weir-soak .bin/weir-soak-previous
