name: Validate chart
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.17.0
      - run: pip install -r requirements-dev.txt
      - name: Install the Weir contract validator
        run: GOBIN="$PWD/.bin" go install github.com/batchstream/weir/cmd/weir@b89ae1e5e8b073176a9f36a6bb264e3a950c41ac
      - name: Install promtool
        run: |
          curl -fsSLo "$RUNNER_TEMP/prometheus.tar.gz" https://github.com/prometheus/prometheus/releases/download/v3.15.1/prometheus-3.15.1.linux-amd64.tar.gz
          echo "6a726885328ad9efebbf36e876ce2fb6225468a71fd1e7ce3ba666d5f4d97a84  $RUNNER_TEMP/prometheus.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/prometheus.tar.gz" --strip-components=1 -C .bin prometheus-3.15.1.linux-amd64/promtool
      - run: make test WEIR_BIN="$PWD/.bin/weir"
        env:
          PROMTOOL: ${{ github.workspace }}/.bin/promtool
      - run: helm package charts/weir --destination dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: weir-chart
          path: dist/*.tgz
