name: Validate chart
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.17.0
      - run: pip install -r requirements-dev.txt
      - name: Checkout the supported Weir source contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: batchstream/weir
          ref: 360f5c13d2d9a6a1cece3f3e61d2c8a231d82609
          path: .weir-contract
          persist-credentials: false
      - name: Build the contract validator
        run: go -C .weir-contract build -o bin/weir ./cmd/weir
      - run: make test WEIR_BIN="$PWD/.weir-contract/bin/weir"
      - run: helm package charts/weir --destination dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: weir-chart
          path: dist/*.tgz
