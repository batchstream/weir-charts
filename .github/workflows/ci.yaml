name: Validate chart
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.0
      - run: pip install -r requirements-dev.txt
      - run: make test
      - run: helm package charts/weir --destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: weir-chart
          path: dist/*.tgz
