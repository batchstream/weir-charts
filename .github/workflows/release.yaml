name: Publish chart
on:
  push:
    tags: ['weir-*']
concurrency:
  group: publish-chart
  cancel-in-progress: false
permissions:
  contents: write
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require reviewed main commit
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.17.0
      - run: pip install -r requirements-dev.txt
      - name: Install the Weir contract validator
        run: GOBIN="$PWD/.bin" go install github.com/batchstream/weir/cmd/weir@b0687cc450fb0133a0b2e0592a5058ec797ba47f
      - run: make package WEIR_BIN="$PWD/.bin/weir"
      - name: Check version
        run: test "$GITHUB_REF_NAME" = "weir-$(helm show chart charts/weir | awk '/^version:/ {print $2}')"
      - name: Checksum release archive
        run: cd dist && sha256sum *.tgz > SHA256SUMS
      - name: Require an unpublished chart version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          version=${GITHUB_REF_NAME#weir-}
          if helm show chart oci://ghcr.io/batchstream/charts/weir --version "$version" 2>"$RUNNER_TEMP/show.err"; then
            echo "chart $version is already published" >&2
            exit 1
          fi
          grep -q ': not found' "$RUNNER_TEMP/show.err"
      # The release is created before the push, so a rerun stops here instead of pushing again.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz dist/SHA256SUMS --generate-notes
      - name: Publish OCI chart
        run: helm push dist/weir-*.tgz oci://ghcr.io/batchstream/charts
